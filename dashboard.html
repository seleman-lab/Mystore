<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library - MyStore Movies</title>
    <link rel="icon" href="assets/logo.png" type="image/x-icon">
    <meta name="description" content="Browse and watch your movie collection.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand">🎬 MyStore</a>
            <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
            <div class="nav-links" id="nav-links">
                <a href="dashboard.html" class="active">My Library</a>
                <a href="upload.html">Upload</a>
                <a href="settings.html">Settings</a>
                <a href="help.html">Help</a>
                <a href="#" id="logout-btn">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="dashboard-header">
            <div>
                <h1>My Movie Library</h1>
                <p class="page-sub">Your movies are stored &amp; streamed from local storage.</p>
            </div>
            <div class="header-actions">
                <a href="upload.html" class="btn btn-primary">+ Upload Movie</a>
            </div>
        </div>

        <!-- Storage Stats -->
        <div class="storage-stats-container">
            <div class="storage-card">
                <h3>Local Storage Usage</h3>
                <div class="storage-bar-wrapper">
                    <div class="storage-bar">
                        <div class="storage-used" id="storage-used" style="width: 0%"></div>
                    </div>
                </div>
                <div class="storage-info">
                    <div class="storage-text">
                        <span id="storage-used-text">0 MB</span> / <span id="storage-limit-text">20 GB</span> used
                    </div>
                    <div class="storage-remaining">
                        <span id="storage-remaining-text">20 GB</span> remaining
                    </div>
                </div>
            </div>
        </div>

        <div class="movies-grid" id="movies-grid">
            <div class="empty-state">
                <div class="empty-icon">🎬</div>
                <h3>No movies yet</h3>
                <p>Upload your first movie to start your collection.</p>
                <a href="upload.html" class="btn btn-primary">+ Upload Movie</a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
