<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch - MyStore Movies</title>
    <link rel="icon" href="assets/logo.png" type="image/x-icon">
    <meta name="description" content="Watch your movie with the custom MyStore player.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="player.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand">🎬 MyStore</a>
            <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
            <div class="nav-links" id="nav-links">
                <a href="dashboard.html" class="active">My Library</a>
                <a href="upload.html">Upload</a>
                <a href="settings.html">Settings</a>
                <a href="help.html">Help</a>
                <a href="#" id="logout-btn">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container watch-container">
        <div id="player-slot"></div>

        <section class="movie-info" id="movie-info" style="display:none;">
            <div class="movie-info-head">
                <div>
                    <h1 id="m-title"></h1>
                    <div class="movie-meta">
                        <span class="badge-year" id="m-year"></span>
                        <span class="badge-genre" id="m-genre"></span>
                        <span class="m-views" id="m-views"></span>
                    </div>
                </div>
                <div class="head-actions">
                    <a class="btn btn-primary" id="download-page-btn" style="display:none;">⬇ Download</a>
                    <button class="btn btn-secondary" id="embed-btn">📋 Copy Embed Code</button>
                </div>
            </div>
            <p class="m-desc" id="m-desc"></p>

            <div class="embed-box" id="embed-box" style="display:none;">
                <p>Paste this code into any website to embed your movie with the custom player:</p>
                <textarea id="embed-code" readonly></textarea>
            </div>
        </section>

        <div id="movie-error" style="display:none;" class="error-card">
            <h2>⚠️ Could not load this movie</h2>
            <p id="movie-error-msg"></p>
            <a href="dashboard.html" class="btn btn-primary">Back to Library</a>
        </div>
    </main>

    <script src="player.js"></script>
    <script src="script.js"></script>
</body>
</html>
